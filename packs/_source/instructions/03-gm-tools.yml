pages:
  - sort: 100000
    name: Create a Scene
    type: text
    _id: IeRRwtptKGvZCG1f
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You need to have a scene in teh game for the GM Tools scene tool to
        be visible on the top left of the screen (the spanner and screwdriver
        icon). Pendragon will create a scene for you if you don't have
        one.</p><p></p><p>The current tools
        are:</p><ul><li><p>@UUID[.Q5xdxqGMY00Tv6jD]{Glory
        Award}</p></li><li><p>@UUID[.dXya6WfqQm63rD9C]{Winter
        Phase}</p></li><li><p>@UUID[.H1y6R0ISSwpuKuMt]{Development
        Phase}</p></li><li><p>@UUID[.OmYmAHWltBg0sVQO]{Character
        Creation}</p></li><li><p>@UUID[.33Wr4vXpMPVT85tz]{GM
        Roll}</p></li><li><p>@UUID[.6aH2K7tpoqzfcCf9]{Reset
        Encounters}</p></li><li><p>@UUID[.aKqujK7wAxwJGVYU]{Increase Game
        Year}</p></li><li><p>@UUID[.aKqujK7wAxwJGVYU]{Decrease Game
        Year}</p></li></ul><p></p><p>Restarting the game (including F5) will
        turn off the phases. If Winter Phase was active and you restart the game
        it will be turned off but the Game Year will not be advanced. You can
        always correct the year manually via the GM tools.</p>
    video:
      controls: true
      volume: 0.5
    src: null
