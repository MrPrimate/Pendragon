      exportSource: null
    category: null
    _key: '!journal.pages!CJhCwQigLrJhBBQF.dXya6WfqQm63rD9C'
  - sort: 300000
    name: Development Phase
    type: text
    _id: H1y6R0ISSwpuKuMt
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>This toggles the <strong>Winter Tab</strong> on and off for
        characters but without changing their age, the Game Year or adding a
        history event.</p><p></p><p>It will however reset the training status
        and will allow characters to improve skills, characteristics, passions
        and traits.</p><p></p><p>See
        @UUID[Compendium.Pendragon.instructions.JournalEntry.NKQVeB00DO4RfHEj]{Winter
        Phase} for more details of how to advance your character.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    system: {}
    ownership:
      default: -1
    flags: {}
    _stats:
