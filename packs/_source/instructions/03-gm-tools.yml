    name: Reset Encounters
    type: text
    _id: 6aH2K7tpoqzfcCf9
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Battle Encounters can be flagged as used, but an Encounter can be
        included in multiple Battles.  </p><p></p><p>This tool will reset all
        Battle Encounters in the Game World (not in Compendia) to 'unused'
        status.  </p>
