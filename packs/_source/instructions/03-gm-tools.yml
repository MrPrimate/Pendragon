  - sort: 500000
    name: GM Roll
    type: text
    _id: 33Wr4vXpMPVT85tz
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>This tool allows the GM to make a roll without having an actor. 
        You'll be asked to:</p><ul><li><p>Select the Roll
        Type</p></li><li><p>Enter a participant name (which appears on the chat
        card)</p></li><li><p>Enter the score you are rolling
        against</p></li></ul><p></p><p>The system will then follow the normal
        roll procedures.</p><p></p><p>There is also a macro included so the GM
        can add this to their hotbar.</p>
    video:
      controls: true
      volume: 0.5
