  - sort: 150000
    name: Glory Award
    type: text
    _id: Q5xdxqGMY00Tv6jD
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>When activated the GM will be presented with a dialog box asking
        for</p><p>1) A title for the award (e.g. Feast Glory)</p><p>2) The
        amount of glory for each character (all in game characters are listed). 
        </p><p></p><p>Any awards of zero are ignored.</p><p>For non-zero awards
        a history item is added to the relevant character.</p>
