  - sort: 200000
    name: Winter Phase
    type: text
    _id: dXya6WfqQm63rD9C
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Clicking on this will toggle the Winter Phase off or on (you will get
        a message at the top of the screen saying what the status
        is).</p><p></p><p>Opening the Winter Phase does several
        things:</p><ul><li><p>It creates a new History event for each character
        adding their passive Glory Total. The event is called "Winter Phase" and
        has the current Game Year shown (i.e. before the
        increase)</p></li><li><p>Activates the <strong>Winter Tab</strong> for
        all characters allowing them to carry out development (See
        @UUID[Compendium.Pendragon.instructions.JournalEntry.NKQVeB00DO4RfHEj.JournalEntryPage.JClE8n4rcuXssKLs]{Winter
        Phase} for more details).</p></li></ul><p>Closing the Winter
        Phase</p><ul><li><p>The Game Year is increased by 1 (which in turn adds
        1 to the characters' ages)</p></li><li><p>Winter Phase is turned off for
        all actors and so they lose access to the <strong>Winter Tab</strong> on
        their character sheets</p></li></ul>
    video:
      controls: true
      volume: 0.5
    src: null
    system: {}
    ownership:
      default: -1
    flags: {}
    _stats:
      duplicateSource: null
      coreVersion: '13.345'
