name: 01) Welcome (All)
pages:
  - sort: 100000
    name: Welcome
    type: text
    _id: nVEgrKj235qjFDdC
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Welcome to the Foundry VTT implementation of Chaosium's Pendragon
        RPG.</p><p></p><p>There is limited automated functionality, but this
        will be developed over time. Hopefully there is enough here to get you
        playing the game and feedback is always welcome to help guide what gets
        worked on.</p><p></p><p>This is not an introduction to Foundry, there
        are many great videos and articles out there on how to use the software.
        This is aimed at helping you get going with Pendragon.</p><p></p><p>The
        following pages are aimed predominantly at either the GM, Players or All
        users.</p><p><br>We hope you enjoy the game.</p><p></p><p></p><p>This
        system gives you the ability to create various items such as Relgions,
        Classes, Cultures etc but does not come packaged with
        any.</p><p></p><p>There is a "P6EBase" module that comes with some basic
        items which appear on the character sheet (such as skills, traits) and
        some samples of other items to give you some examples to work from. 
        This will save your a chunk of set up time.  If you have bought the
        "Core Rulebook" premium module then you won't need the "P6EBase" module
        as the Core Rulebook has enhanced/expanded versions of the item in the
        Base module.</p>
