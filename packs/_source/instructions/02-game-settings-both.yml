  - sort: 375000
    name: Manual Glory
    type: text
    _id: ioJEGkzKwjKh9mR6
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>When activated this setting will add a permanent line at the top of
        the History table where you can manually enter a Glory Adjustment.  The
        score is persistent so you don't add +10, or -20 - just the current
        total adjustment.</p><p>This is aimed at GMs who don't want to have
        history items for each award.</p>
