  - sort: 100000
    name: Game Year (GM only)
    type: text
    _id: ty31IeGwbI6DR5cM
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>From v14.5 onwards</strong></p><p>This setting is no longer
        used (and is not visible), instead the system uses the inbuilt Foundry
        calendar. You can use the
        @UUID[Compendium.Pendragon.instructions.JournalEntry.CJhCwQigLrJhBBQF]{GM
        tools} to alter the year or alternatively in the console (F12) you can
        enter</p><p><br>await game.time.set({year: 510})</p><p></p><p>you can
        change 510 for your desired year.</p><p></p><p>When creating a new world
        the Game Year will be set to 510 by default.</p><p></p><p><strong>Up to
        v14.4</strong></p><p>Enter the year of the game.</p><p></p><p>As you
        runt the Winter Phase the year will automatically update but you can
        manually change the year here as needed.</p><p></p><p>When creating a
        new History Events the year defaults to the Game Year.</p><p></p><p></p>
    video:
      controls: true
      volume: 0.5
    src: null
    system: {}
    ownership:
