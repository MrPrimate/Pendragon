  - sort: 150000
    name: Combat/Damage Options
    type: text
    _id: k4EAubcSwrqtCWCs
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>There is currently one option in this
        screen</p><p></p><p><strong>Track Wounds</strong></p><p>Please note this
        is an experimental feature and is currently only applicable to the v1
        (original) character sheet.</p><p></p><p>When ticked (the default) you
        add wounds to a character which in turn calculates the current
        HP.</p><p></p><p>When unticked you no longer create wounds or see them
        on the character sheet. Instead you direcrly enter the current HP score.
        This means that there is no automatic tracking for Major or Mortal
        wounds.</p><p></p><p>Natural Healing is still applied when activated but
        the current HP are adjusted (after allowing for Aggravated and
        Deterioriation damage).</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    ownership:
      default: -1
    flags: {}
