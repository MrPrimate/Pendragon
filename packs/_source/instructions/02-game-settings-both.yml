  - sort: 300000
    name: Dice Roll Options
    type: text
    _id: 8JRDCc5CePLRMFxN
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>There are two options here:</p><p></p><p><strong>Toggle SHIFT
        click</strong></p><p>By default when clicking a Check Roll (skill, trait
        etc) a dialogue box opens asking for things like modifiers. Pressing
        SHIFT and clicking stops this box from appearing and uses no modifiers
        (unless set by something else in the game).</p><p>Toggling this option
        on changes this behaviour so that the default is that no box appears,
        and using SHIFT + click causes the box to appear.</p><p>This is set
        separately by the person playing the game and can be different for each
        player.</p><p></p><p>This <strong>does not</strong> apply to Horse
        damage where the SHIFT key is used to apply charging
        damage.</p><p></p><p></p><p><strong>Critical Bonus
        Adjustment</strong></p><p>When an opposed or combat roll is made and all
        parties have a critical bonus due to scores of 20+ then all parties
        bonuses are reduced by the lowest bonus.</p><p>For example, two knights
        with Sword Skills of 20 (+3) and 20 (+5) would see their Skills reduced
        to 20 and 20 (+2), respectively. This rule has the effect of putting
        equally-proficient characters on a more even footing with fewer critical
        successes overall.</p><p></p><p><strong>Finish Dice
        Rolls</strong></p><p>When activated the Combat and Opposed Chat Cards
        will not update until the dice animations have finished if using Dice So
        Nice</p>
    video:
      controls: true
